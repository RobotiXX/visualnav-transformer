# Architecture paired with checkpoints/vint.pth from the official ViNT release.
# Keep this file with the checkpoint in experiment metadata.
model_type: vint
obs_encoder: efficientnet-b0
obs_encoding_size: 512
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
late_fusion: false
context_size: 5
# The model predicts five cumulative robot-relative points. Their endpoint
# distance and polyline length vary with the model output; this is not a fixed
# five-times-metric_waypoint_spacing_m rollout.
len_traj_pred: 5
learn_angle: true
image_size: [85, 64]
normalize: true

# ViNT predicts embodiment-normalized waypoints. The paper calls for a
# robot-specific controller to unnormalize them according to the target robot's
# top speed, and the released deployment implements that scale as max_v / rate.
# The ScoutMini study uses 0.8 m/s / 4 Hz = 0.20 m. For a later 1.0 m/s study,
# change this value to 0.25 m together with the controller's
# maximum_linear_speed; do not change only one side of that contract.
metric_waypoint_spacing_m: 0.20
