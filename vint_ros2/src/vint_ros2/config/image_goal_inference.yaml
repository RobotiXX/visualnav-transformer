vint_image_goal_inference:
  ros__parameters:
    # `mock` validates ROS/Nav2 wiring without weights. Use `torch` for the
    # released checkpoint or a trusted fine-tuned checkpoint.
    backend: mock
    # Mock parameters only. Torch obtains context and trajectory dimensions
    # from model_config_path and ignores horizon_points/horizon_distance_m.
    context_size: 5
    horizon_points: 5
    horizon_distance_m: 1.25
    # Torch mode requires absolute paths. The released weights pair with the
    # installed config/vint_release_model.yaml file.
    checkpoint_path: ""
    model_config_path: ""
    device: cuda
    route_manifest: ""
    # The robot adapter owns any vendor-specific camera remapping.
    image_topic: /camera/image/compressed
    image_type: compressed
    global_plan_topic: /vint/image_goal/global_plan
    prediction_topic: /vint/image_goal/predicted_path
    robot_frame: base_link
    # Match the original deployment frame rate and local-topomap search.
    inference_rate_hz: 4.0
    # Search from closest_node - radius through closest_node + radius + 1.
    topomap_radius: 4
    # Advance to the next route image when minimum predicted distance <= 3.
    close_threshold: 3.0
    # Nav2 integration only: reject a plan for a different route destination.
    route_destination_tolerance_m: 1.0
    # Rate-limit repeated warnings without changing failure behavior.
    warning_throttle_sec: 2.0
