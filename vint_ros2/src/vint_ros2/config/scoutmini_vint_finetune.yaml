project_name: rwd-vint
run_name: scoutmini-vint-finetune

use_wandb: false
train: true
batch_size: 128
eval_batch_size: 128
epochs: 50
gpu_ids: [0]
num_workers: 8
lr: 0.0001
optimizer: adamw
clipping: false
max_norm: 1.0
scheduler: cosine
warmup: true
warmup_epochs: 4
seed: 0

model_type: vint
obs_encoder: efficientnet-b0
obs_encoding_size: 512
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
late_fusion: false
normalize: true
context_type: temporal
context_size: 5
alpha: 0.5
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 0
  max_dist_cat: 10
close_far_threshold: 10
len_traj_pred: 5
learn_angle: true
image_size: [85, 64]
goal_type: image
metric_waypoint_spacing_m: 0.25

# These paths are relative to the train directory used by train/train.py.
datasets:
  scoutmini:
    data_folder: ../datasets/scoutmini
    train: ../data_splits/scoutmini/train
    test: ../data_splits/scoutmini/test
    end_slack: 0
    goals_per_obs: 1
    negative_mining: true

print_log_freq: 100
image_log_freq: 1000
num_images_log: 8
pairwise_test_freq: 0
eval_fraction: 0.25
wandb_log_freq: 10
eval_freq: 1
