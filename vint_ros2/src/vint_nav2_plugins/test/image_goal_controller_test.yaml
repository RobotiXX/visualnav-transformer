controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    failure_tolerance: 0.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: /test_vint/odom
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
    FollowPath:
      plugin: vint_nav2_plugins/ImageGoalController
      robot_frame: base_link
      global_plan_topic: /test_vint/global_plan
      prediction_topic: /test_vint/predicted_path
      waypoint_index: 1
      minimum_prediction_points: 2
      prediction_timeout_sec: 0.2
      maximum_path_start_error_m: 0.1
      linear_gain: 1.0
      angular_gain: 2.0
      maximum_linear_speed: 0.4
      maximum_angular_speed: 0.8

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 0.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.2
      plugins: [obstacle_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: false
      always_send_full_costmap: true
