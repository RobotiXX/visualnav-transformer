controller_server:
  ros__parameters:
    # This standalone fragment is composed into the stable `FollowPath` ID by
    # `compose_nav2_profile`; task-executor behavior trees do not change.
    controller_plugins: [ViNTImageGoal]
    ViNTImageGoal:
      plugin: vint_nav2_plugins/ImageGoalController

      # Frame and topic contract. The inference node consumes the published
      # global path and returns a short robot-relative path in robot_frame.
      robot_frame: base_link
      global_plan_topic: /vint/image_goal/global_plan
      prediction_topic: /vint/image_goal/predicted_path

      # ViNT returns an H=5 short-range rollout. As in the original ROS 1
      # deployment, index 2 selects the third model point as the feedback
      # target. The origin prepended to the ROS Path is not counted here.
      waypoint_index: 2
      # The ROS Path normally contains one origin plus five model points.
      minimum_prediction_points: 2

      # Match the original PD node's one-second waypoint timeout. Missing or
      # stale predictions return zero velocity without aborting FollowPath;
      # Nav2 cancellation and its shared progress checker remain active.
      prediction_timeout_sec: 1.0
      # Reject paths whose first pose is not near the robot-frame origin.
      maximum_path_start_error_m: 0.25

      # Reproduce deployment/src/pd_controller.py with DT = 1 / 4 Hz:
      #   v = waypoint_x / DT
      #   w = atan(waypoint_y / waypoint_x) / DT
      # followed by forward-only clamps. ViNT's paper specifies robot-specific
      # waypoint unnormalization based on top speed. The paired release-model
      # profile scales normalized points by 0.8 m/s / 4 Hz = 0.20 m, while this
      # controller caps the resulting command at the same 0.8 m/s study speed.
      # For a 1.0 m/s study, change both values to 0.25 m and 1.0 m/s. At
      # near-zero x/y, the predicted heading vector supplies angular velocity.
      linear_gain: 4.0
      angular_gain: 4.0
      maximum_linear_speed: 0.8
      maximum_angular_speed: 0.4
